name: Deploy StockControl to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Die Anwendung wird zur Startseite: index.html IST StockControl.
      # Damit lautet die Adresse .../StockControl/ ohne Dateinamen dahinter.
      - name: Anwendung als Startseite setzen
        run: |
          cp StockControl.dc.html index.html
          touch .nojekyll
          ls -la

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
